services:
  - type: web
    name: msedcl-website
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: APP_SECRET_KEY
        generateValue: true
      - key: SERVE_REACT_FRONTEND
        value: "true"
      - key: DATABASE_PATH
        value: /app/quality_audit.db
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: MAX_UPLOAD_MB
        value: 25
      - key: ADMIN_USERNAME
        value: qaadmin
      - key: ADMIN_PASSWORD
        sync: false
      - key: QUALITY_USERNAME
        value: quality1
      - key: QUALITY_PASSWORD
        sync: false
      - key: MANAGER_USERNAME
        value: manager1
      - key: MANAGER_PASSWORD
        sync: false
